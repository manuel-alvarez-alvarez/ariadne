# Configuration for `cargo audit` (crates/AGENTS.md, .github/AGENTS.md).
#
# `cargo audit` denies no warning category by default, so an entry here is
# documentation of a warning this branch cannot clear yet, not what keeps CI
# green: CI stays green on its own as long as no *vulnerability* (as opposed
# to an unmaintained or yanked notice) is outstanding.
[advisories]
# bincode 1.3.3 is pulled in by syntect 5.3.0 (crates/ariadne-console), the
# newest syntect release published. syntect has not moved off bincode 1, so
# there is no upgrade that clears this without dropping syntax highlighting.
# Revisit when syntect ships a release on a maintained serializer.
ignore = ["RUSTSEC-2025-0141"]

# Not ignorable here: zip 3.0.0 (pulled in by utoipa-swagger-ui 9.0.2's build
# script, crates/ariadne-daemon) is yanked, but so is every other version of
# `zip` ever published except 9.0.3 and 9.0.4, and no release of
# utoipa-swagger-ui up to its own latest, 10.0.1, depends on a zip in that
# range (10.0.1 still pins "8.6", itself fully yanked). `cargo audit`'s
# yanked check has no per-package allowlist, only the all-or-nothing
# `[yanked] enabled` switch, which would also hide a future, unrelated yank -
# so this is left as the one warning `cargo audit` prints and does not deny.
# Revisit when utoipa-swagger-ui publishes against a non-yanked zip.
