[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop UI ships its own Tauri crate with an independent dependency tree
# and release profile; it is built by `npm run tauri build` inside `ui/`, never
# by the workspace.
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# workspace crates
ariadne-core = { path = "crates/ariadne-core" }
ariadne-api = { path = "crates/ariadne-api" }
ariadne-store = { path = "crates/ariadne-store" }
ariadne-client = { path = "crates/ariadne-client" }

# async runtime / http
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = { version = "1", features = ["http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyperlocal = "0.9"
http = "1"
http-body-util = "0.1"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }

# openapi
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }

# database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }

# serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
toml = "0.9"

# cli
clap = { version = "4.6", features = ["derive", "env", "unstable-ext"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }

# errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# misc
# Safe wrappers over the POSIX calls std does not expose. Used for access(2):
# whether *this* process may write a directory is a question only the kernel
# can answer, and `ariadne doctor` must ask it without writing anything.
rustix = { version = "1", features = ["fs", "process"] }
ulid = { version = "3", features = ["serde"] }
# Filesystem notifications: the console-log streamer is woken by the writes
# themselves instead of polling for them (see `ariadne-daemon/src/logwatch.rs`).
# kqueue rather than the default FSEvents on macOS: FSEvents does not report a
# write to a file that is still open, and tmux `pipe-pane` holds the console
# log open for the whole of a session.
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
# Sleep inhibition: keepawake wraps the macOS and Windows power APIs, zbus
# talks to systemd-logind on Linux.
keepawake = { version = "0.6", default-features = false }
zbus = "5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
