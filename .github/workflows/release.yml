# Attaches the compiled artifacts to a published GitHub Release.
#
# release-please cuts the tag and publishes the release, then dispatches this
# workflow *on that tag* — a release it publishes with the default
# `GITHUB_TOKEN` fires no `release: published` event, so the trigger below
# would never see it. That trigger stays for releases published by hand, which
# do fire it. Either way the run is anchored to the tag and never to main:
# the sources, this workflow file and `github.ref` all come from the tag, so
# the provenance attestation names the tag as the origin of the assets.
#
# This workflow builds every supported target on its own native runner (no
# cross-compilation) and uploads the assets the installer script downloads by
# name:
#
#   ariadne-<target>.tar.gz              the `ariadne` and `ariadned` binaries
#   ariadne-desktop-<target>.app.tar.gz  Ariadne Desktop.app (macOS)
#   ariadne-desktop-<target>.AppImage    Ariadne Desktop (Linux)
#   checksums-<target>.txt               sha256 of the assets above
#
# Nothing here is signed or notarized: the artifacts ship unsigned and the
# installer clears the macOS quarantine attribute itself. What the assets do
# carry is a build provenance attestation, verifiable with
# `gh attestation verify <asset> --repo <owner>/<repo>`.
name: Release assets

on:
  # Only for releases published by hand: see the header.
  release:
    types: [published]
  # The path release-please takes, and reruns: point at an existing tag when a
  # matrix leg failed or a runner image broke mid-release. Run it *from* that
  # tag — the ref dropdown, not main — or the assets are attested against the
  # ref the run happened on.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build assets for, e.g. v0.1.0 — run this from that same tag
        required: true
        type: string

# No permissions by default; the build job asks for the three scopes it needs.
permissions: {}

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # upload the assets to the release
      id-token: write # OIDC token the attestation is signed with
      attestations: write # write the provenance attestations
    strategy:
      # One broken runner image must not cost the other three targets.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # The checkout below pins the sources to the tag whatever ref the run was
      # started on, but the attestation can only record `github.ref`. Say so
      # loudly rather than publishing assets whose provenance points at main.
      - name: Check the run is anchored to the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/tags/$TAG" ]; then
            echo "::warning::this run is on $REF, so $TAG's assets will be attested as built from $REF; rerun it from refs/tags/$TAG"
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install the Tauri build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      # Stable is at least 1.85, the edition 2024 floor the workspace needs.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      # The asset names promise a target triple, so refuse to build when the
      # runner label has quietly moved to another architecture.
      - name: Check the runner matches the target triple
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
          TARGET: ${{ matrix.target }}
        run: |
          host=$(rustc --version --verbose | awk '/^host: / { print $2 }')
          if [ "$host" != "$TARGET" ]; then
            echo "::error::runner $RUNNER_LABEL builds for $host, but assets would be named $TARGET"
            exit 1
          fi

      - name: Cache the cargo builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # The desktop shell is a workspace of its own, excluded from the root
          # one, and has a target directory to match.
          workspaces: |
            . -> target
            ui/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build ariadne and ariadned
        run: cargo build --release --locked --package ariadne-cli --package ariadne-daemon

      - name: Install the desktop app's dependencies
        working-directory: ui
        run: npm ci

      # `--bundles app` skips the dmg: the release ships the .app tarball only.
      - name: Build Ariadne Desktop (.app)
        if: matrix.platform == 'macos'
        working-directory: ui
        run: npm run tauri build -- --bundles app

      - name: Build Ariadne Desktop (AppImage)
        if: matrix.platform == 'linux'
        working-directory: ui
        env:
          # linuxdeploy ships as an AppImage and the runners have no FUSE to
          # mount it with, so let it unpack itself instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npm run tauri build -- --bundles appimage

      - name: Stage the release assets
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # Both binaries at the archive root, executable.
          chmod 755 target/release/ariadne target/release/ariadned
          tar -czf "$PWD/dist/ariadne-$TARGET.tar.gz" -C target/release ariadne ariadned

          bundle=ui/src-tauri/target/release/bundle
          if [ "$PLATFORM" = macos ]; then
            # Tarred from inside the bundle directory so "Ariadne Desktop.app"
            # sits at the archive root; --mac-metadata keeps the symlinks and
            # extended attributes the bundle needs to stay loadable.
            tar --mac-metadata -czf "$PWD/dist/ariadne-desktop-$TARGET.app.tar.gz" \
              -C "$bundle/macos" "Ariadne Desktop.app"
          else
            appimage=$(find "$bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)
            if [ -z "$appimage" ]; then
              echo "::error::no AppImage was produced under $bundle/appimage"
              exit 1
            fi
            install -m 755 "$appimage" "dist/ariadne-desktop-$TARGET.AppImage"
          fi

          # sha256, one line per asset, `<digest>  <name>`. The checksums file
          # never lists itself: every asset is named ariadne-*.
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum ariadne-*) > "dist/checksums-$TARGET.txt"
          else
            (cd dist && shasum -a 256 ariadne-*) > "dist/checksums-$TARGET.txt"
          fi

          ls -l dist

      # Before the upload, so nothing reaches the release unattested.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber
