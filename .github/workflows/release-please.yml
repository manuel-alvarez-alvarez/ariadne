# Versioning, changelog and GitHub Releases, driven by conventional commits.
#
# On every push to `main` release-please recomputes the pending release from
# the commits since the last tag and keeps a single "chore(main): release
# X.Y.Z" pull request open. Merging that PR bumps every version location
# listed in `release-please-config.json`, writes `CHANGELOG.md`, tags `vX.Y.Z`
# and publishes the matching GitHub Release.
#
# The assets that hang off that Release are built by a second workflow,
# `.github/workflows/release.yml`, which this one dispatches explicitly. It
# cannot simply trigger on the Release: GitHub never fires workflow triggers
# for events created with the default `GITHUB_TOKEN`, so the `release:
# published` trigger in release.yml never sees a release-please release at
# all. Hence the dispatch step below, and the `actions: write` scope it needs.
#
# Only conventional-commit subjects reach the notes and move the version:
# `feat:` (minor), `fix:`/`perf:`/`revert:` (patch), and `feat!:` or a
# `BREAKING CHANGE:` footer (minor while we are pre-1.0). `chore:`, `docs:`
# and friends ride along in a release but never trigger one; anything that is
# not a conventional commit is ignored entirely.
#
# See .github/RELEASING.md, including the one-time repository setting that
# lets Actions open the release PR.
name: release-please

on:
  push:
    branches:
      - main

# The default GITHUB_TOKEN is enough; no PAT is needed.
permissions:
  contents: write # create tags, releases and the release branch
  pull-requests: write # open and update the release PR
  actions: write # dispatch the release assets build

# Two pushes in quick succession must not race to create the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The one package in the manifest is the repository root, so v5 writes
      # its outputs unprefixed: `release_created` is set only on the runs that
      # actually published a Release, and `tag_name` is the tag it was cut
      # from — the tag release.yml checks out and uploads to.
      - name: Build the release assets
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run release.yml --field tag="$TAG"
