# Versioning, changelog and GitHub Releases, driven by conventional commits.
#
# On every push to `main` release-please recomputes the pending release from
# the commits since the last tag and keeps a single "chore(main): release
# X.Y.Z" pull request open. Merging that PR bumps every version location
# listed in `release-please-config.json`, writes `CHANGELOG.md`, tags `vX.Y.Z`
# and publishes the matching GitHub Release. The assets that hang off that
# Release are built by a second workflow, `.github/workflows/release.yml`,
# which the `release: published` event starts on its own.
#
# All of this acts as `RELEASE_PLEASE_TOKEN`, a personal access token, rather
# than as the default `GITHUB_TOKEN`, for two reasons:
#
#   * A pull request opened with `GITHUB_TOKEN` is authored by
#     `github-actions[bot]`, which is no repository collaborator but a plain
#     contributor. Under the "require approval for first-time contributors"
#     Actions setting that makes every CI run on the release branch sit in
#     `action_required` until a maintainer approves it by hand. Opened under a
#     token of our own, the release PR is an owner's PR and its CI just runs.
#   * GitHub fires no workflow triggers at all for events created with
#     `GITHUB_TOKEN`, so a Release published with it would never start
#     release.yml. A Release published with a PAT does.
#
# The token, the scopes it needs and how to replace it when it expires are in
# .github/RELEASING.md. Without the secret this workflow fails outright on bad
# credentials — it does not silently fall back to `GITHUB_TOKEN`.
#
# Only conventional-commit subjects reach the notes and move the version:
# `feat:` (minor), `fix:`/`perf:`/`revert:` (patch), and `feat!:` or a
# `BREAKING CHANGE:` footer (minor while we are pre-1.0). `chore:`, `docs:`
# and friends ride along in a release but never trigger one; anything that is
# not a conventional commit is ignored entirely.
name: release-please

on:
  push:
    branches:
      - main

# Every call below is made with the PAT, so the job's own `GITHUB_TOKEN` needs
# no scope of its own.
permissions: {}

# Two pushes in quick succession must not race to create the release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
