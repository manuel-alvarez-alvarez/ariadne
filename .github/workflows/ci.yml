# Compile, test and lint everything the repository builds: the Rust workspace,
# the Vite UI, and the desktop shell's own Tauri workspace.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull-request branch makes the run in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # CI never wants a backtrace-less panic report.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Edition 2024 needs stable >= 1.85. The action has no version tags of
      # its own: `@stable` is its released toolchain channel.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # nextest's JUnit output is what the report step at the end of this job
      # turns into named annotations; plain `cargo test` has no such report.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS; the matrix legs must not share a target dir.
          key: ${{ matrix.os }}
          cache-on-failure: true

      # The ignored integration tests drive real tmux panes, and the keystroke
      # ones script a TUI in python3. macOS runners have no tmux and do not
      # run them.
      - name: Install tmux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests; run them the normal way so they still
      # gate CI.
      - name: Doctests
        run: cargo test --doc --workspace

      # `-D warnings` on top of the workspace's `clippy::all = warn`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Real tmux and real git, plus the `ariadne` CLI the spawn-plan test
      # launches — built into the same target dir by the build step above.
      # A separate nextest profile so this run's report does not overwrite
      # the Test step's above.
      - name: Integration tests (tmux, git)
        if: matrix.os == 'ubuntu-latest'
        run: cargo nextest run -p ariadne-daemon --profile ci-ignored --run-ignored only

      # Name the failed test in the run summary and as an annotation, rather
      # than leaving it to a dig through the raw log. Runs even when a test
      # above failed.
      - name: Report test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'target/nextest/*/junit.xml'
          check_name: Rust tests (${{ matrix.os }})
          annotate_only: true

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Name the failed test in the run summary and as an annotation, rather
      # than leaving it to a dig through the raw log. Runs even when a test
      # above failed.
      - name: Report test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'ui/junit.xml'
          check_name: UI tests
          annotate_only: true

  tauri:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-ubuntu-latest
          workspaces: ui/src-tauri
          cache-on-failure: true

      # Tauri v2's documented Linux prerequisites: the -sys crates' build
      # scripts ask pkg-config for these headers, so even a `cargo check`
      # that produces no bundle needs them.
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      # No frontend bundle is built or needed: `tauri-build` only reads the
      # config and the icons, so the shell's Rust compiles on its own.
      - name: Check
        run: cargo check
        working-directory: ui/src-tauri
