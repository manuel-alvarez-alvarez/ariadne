# Compile, test and lint everything the repository builds: the Rust workspace,
# the Vite UI, and the desktop shell's own Tauri workspace.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never wants a backtrace-less panic report.
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      # Edition 2024 needs stable >= 1.85. The action has no version tags of
      # its own: `@stable` is its released toolchain channel.
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # One cache per OS; the matrix legs must not share a target dir.
          key: ${{ matrix.os }}

      # The ignored integration tests drive real tmux panes, and the keystroke
      # ones script a TUI in python3. macOS runners have no tmux and do not
      # run them.
      - name: Install tmux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # `-D warnings` on top of the workspace's `clippy::all = warn`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Real tmux and real git, plus the `ariadne` CLI the spawn-plan test
      # launches — built into the same target dir by the build step above.
      - name: Integration tests (tmux, git)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p ariadne-daemon -- --ignored

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  tauri:
    name: Tauri shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri-ubuntu-latest
          workspaces: ui/src-tauri

      # Tauri v2's documented Linux prerequisites: the -sys crates' build
      # scripts ask pkg-config for these headers, so even a `cargo check`
      # that produces no bundle needs them.
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file

      # No frontend bundle is built or needed: `tauri-build` only reads the
      # config and the icons, so the shell's Rust compiles on its own.
      - name: Check
        run: cargo check
        working-directory: ui/src-tauri
