# Proposes dependency updates as pull requests; it does not gate anything.
# `ci.yml`'s `cargo audit` and `npm run check:audit` are what fail a build on
# an advisory (.github/AGENTS.md, specs/016-install-service-and-release.md).
#
# Five entries, at most two weekly pull requests each: one for every minor
# and patch bump together, and one for every major bump together, so a family
# that moves in lockstep (OpenTelemetry, Tauri) lands in one pull request
# instead of one per package. `ui/` and `ui/dashboard/` get separate pull
# requests, one npm entry each. Security updates are left ungrouped, one pull
# request per advisory, so each fix can land without waiting on the week.
# Every commit Dependabot writes carries the `chore(deps)` prefix, which
# release-please ignores the same as any other `chore` commit (root
# AGENTS.md), so a dependency bump alone never triggers a release.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
      cargo-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  # `ui/src-tauri` is its own Cargo workspace, excluded from the root one
  # (crates/AGENTS.md), so it needs its own `cargo` entry.
  - package-ecosystem: "cargo"
    directory: "/ui/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri-cargo-minor-patch:
        update-types: ["minor", "patch"]
      tauri-cargo-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  # `ui/` and `ui/dashboard/` are separate npm packages with their own
  # lockfiles, so each gets its own entry and its own weekly pull requests.
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    groups:
      ui-npm-minor-patch:
        update-types: ["minor", "patch"]
      ui-npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/ui/dashboard"
    schedule:
      interval: "weekly"
    groups:
      dashboard-npm-minor-patch:
        update-types: ["minor", "patch"]
      dashboard-npm-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
      actions-major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
