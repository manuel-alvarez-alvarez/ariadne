[package]
name = "ariadne-knowledge"
description = "Ariadne knowledge base: the symbol index over every registered repository"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
# Streams the definitions of a name row by row, rather than all at once.
futures-util = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The parser and the tags queries that name a definition in each grammar.
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
# One grammar per tags language the registry knows. Each ships the tags
# query the parser runs.
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-dart = "0.2"
tree-sitter-elixir = "0.3"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-lua = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
# One grammar per outline-only format: no tags query, read for a structure
# of its own (headings, keys, selectors, `CREATE`/`ALTER` targets).
tree-sitter-css = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
