[package]
name = "ariadne-knowledge"
description = "Ariadne knowledge base: the symbol index over every registered repository"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The parser and the tags queries that name a definition in each grammar.
tree-sitter = "0.27"
tree-sitter-tags = "0.27"
# One grammar per language the registry knows. Each ships the tags query
# the parser runs, except Markdown, whose outline is its headings.
tree-sitter-c-sharp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
