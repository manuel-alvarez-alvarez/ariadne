[package]
name = "ariadne-daemon"
description = "Ariadne daemon: REST API, scheduler, ACP agent and git orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ariadned"
path = "src/main.rs"

[dependencies]
ariadne-core = { workspace = true }
ariadne-api = { workspace = true }
ariadne-store = { workspace = true }
# For the shared home/socket resolution: the daemon and its clients must not
# drift on where the socket is.
ariadne-client = { workspace = true }
# The session console the daemon hosts in process for a terminal at the far
# end of a WebSocket, and the key events it is driven by.
ariadne-console = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

# Sleep inhibition (see `src/sleep.rs`), per target because neither dependency
# means anything anywhere else — platforms with no backend get the stub.
# IOKit assertion / SetThreadExecutionState:
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keepawake = { workspace = true }
# systemd-logind's Inhibit, which is just a D-Bus call:
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
# Tests that need a clock the store does not offer: `last_activity_at` is
# only ever stamped "now", and an idle threshold is many minutes away.
sqlx = { workspace = true }
tempfile = "3"
# The WebSocket client the terminal console tests connect with, and the
# terminal emulator they read its bytes back through.
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
vt100 = { workspace = true }

[lints]
workspace = true
