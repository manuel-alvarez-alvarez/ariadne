[package]
name = "ariadne-daemon"
description = "Ariadne daemon: REST API, scheduler, tmux and git orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ariadned"
path = "src/main.rs"

[dependencies]
ariadne-core = { workspace = true }
ariadne-api = { workspace = true }
ariadne-store = { workspace = true }
# For the shared home/socket resolution: the daemon and its clients must not
# drift on where the socket is.
ariadne-client = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }

# Native sleep inhibition (IOKit / logind / SetThreadExecutionState). Declared
# per target because the crate refuses to compile where it has no backend; see
# `src/sleep.rs` for the stub that takes over there.
[target.'cfg(any(target_os = "macos", target_os = "linux", windows))'.dependencies]
keepawake = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
tempfile = "3"
tower = { workspace = true }

[lints]
workspace = true
