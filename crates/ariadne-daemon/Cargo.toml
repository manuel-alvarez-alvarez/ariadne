[package]
name = "ariadne-daemon"
description = "Ariadne daemon: REST API, scheduler, ACP agent and git orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
# The integration tests are the one binary `tests/it/main.rs` declares below,
# not a binary per file under `tests/`.
autotests = false

[[bin]]
name = "ariadned"
path = "src/main.rs"
# `main.rs` holds no tests, and a test harness for it is one more binary to
# compile and link on every change to the daemon.
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
tempfile = "3"
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
agent-client-protocol = { workspace = true }
tokio-util = { workspace = true }
ariadne-core = { workspace = true }
ariadne-api = { workspace = true }
ariadne-store = { workspace = true }
# For the shared home/socket resolution: the daemon and its clients must not
# drift on where the socket is.
ariadne-client = { workspace = true }
# The session console the daemon hosts in process for a terminal at the far
# end of a WebSocket, and the key events it is driven by.
ariadne-console = { workspace = true }
# The symbol index the daemon fills off the request path and serves to
# every seat.
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
similar = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
crossterm = { workspace = true }
futures-util = { workspace = true }
notify = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
rustix = { workspace = true }
# The resident memory behind `process.memory.usage` (035): the safe read of
# Mach's `task_info` on macOS and of `/proc/self/statm` on Linux, which
# rustix does not wrap and the workspace forbids `unsafe` to call.
memory-stats = "1"
serde = { workspace = true }
# `raw_value`: the tunnel passes a smee.io delivery body on as smee wrote it (027).
serde_json = { workspace = true, features = ["raw_value"] }
serde_urlencoded = { workspace = true }
pulldown-cmark = { workspace = true }
promql-parser = { workspace = true, features = ["ser"] }
sqlx = { workspace = true }
tokio = { workspace = true }
# Relay remote terminal consoles, and connect terminal tests.
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
url = { workspace = true }

# Sleep inhibition (see `src/sleep.rs`), per target because neither dependency
# means anything anywhere else — platforms with no backend get the stub.
# IOKit assertion / SetThreadExecutionState:
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keepawake = { workspace = true }
# systemd-logind's Inhibit, which is just a D-Bus call:
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { workspace = true }

[dev-dependencies]
toml = { workspace = true }
http-body-util = { workspace = true }
# Tests that need a clock the store does not offer: `last_activity_at` is
# only ever stamped "now", and an idle threshold is many minutes away.
sqlx = { workspace = true }
# The terminal emulator that tests read console bytes through.
vt100 = { workspace = true }

[lints]
workspace = true
