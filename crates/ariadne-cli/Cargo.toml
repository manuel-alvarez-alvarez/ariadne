[package]
name = "ariadne-cli"
description = "Ariadne CLI: docker-style control of the ariadned daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[dependencies]
ariadne-api = { workspace = true }
ariadne-client = { workspace = true }
ariadne-core = { workspace = true, features = ["clap"] }
# For one question only: whether the database `ariadned` refuses to open is one
# from before the schema was squashed. `ariadne doctor` is what is left running
# to answer it, and answering it takes reading the file.
ariadne-store = { workspace = true }
anstyle = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
# The three the inline console of `ariadne attach` is made of: the raw mode
# and the key stream under it, the widgets drawn in its viewport, and the
# parser that turns an agent's markdown into styled lines.
crossterm = { workspace = true }
dirs = { workspace = true }
# `StreamExt::next`, for awaiting the console's key stream beside the daemon's
# event stream in one `select!`.
futures-util = { workspace = true }
http = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
# For two questions std does not answer: the uid whose launchd domain the
# daemon's service lives in (`gui/<uid>/dev.ariadne.daemon`), and how wide the
# terminal is (`ioctl(TIOCGWINSZ)`). rustix is the workspace's wrapper over the
# POSIX calls behind both.
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
# One call: putting SIGPIPE back to its default disposition so a closed pipe
# (`ariadne task ls | head`) ends the process instead of panicking a printing
# macro. The workspace forbids `unsafe_code`, so the `signal(2)` call has to
# live in a dependency.
sigpipe = "0.1.3"
# The hunks of a tool call's file change, where the agent sent the old and the
# new text of the file rather than a patch.
similar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# The display width the console wraps and cuts text by, so a wide character
# or an emoji takes the two columns it draws on, and the grapheme clusters
# it cuts between, so an emoji of several characters is never cut in two.
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
# The console tests run a small API server for the CLI client.
axum = { workspace = true }
# Only to plant the migration row that makes a database a pre-squash one, for
# the doctor check that reports it.
sqlx = { workspace = true }
tempfile = "3"
# `start_paused`: the console's turn clock is asserted at a minute without
# waiting one out.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
