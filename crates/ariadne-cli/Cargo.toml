[package]
name = "ariadne-cli"
description = "Ariadne CLI: docker-style control of the ariadned daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[dependencies]
ariadne-api = { workspace = true }
ariadne-client = { workspace = true }
ariadne-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
