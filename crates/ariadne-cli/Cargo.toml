[package]
name = "ariadne-cli"
description = "Ariadne CLI: docker-style control of the ariadned daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[dependencies]
ariadne-api = { workspace = true }
ariadne-client = { workspace = true }
ariadne-core = { workspace = true, features = ["clap"] }
# For one question only: whether the database `ariadned` refuses to open is one
# from before the schema was squashed. `ariadne doctor` is what is left running
# to answer it, and answering it takes reading the file.
ariadne-store = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Only to plant the migration row that makes a database a pre-squash one, for
# the doctor check that reports it.
sqlx = { workspace = true }
tempfile = "3"

[lints]
workspace = true
