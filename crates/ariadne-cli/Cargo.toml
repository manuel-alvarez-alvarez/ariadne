[package]
name = "ariadne-cli"
description = "Ariadne CLI: docker-style control of the ariadned daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[dependencies]
ariadne-api = { workspace = true }
ariadne-client = { workspace = true }
ariadne-core = { workspace = true, features = ["clap"] }
# For the default prompt texts alone (ariadne_store::defaults): `profile
# prompts` says whether a prompt still matches the default its role starts
# from, and the daemon serves no way to ask.
ariadne-store = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
dirs = { workspace = true }
http = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
